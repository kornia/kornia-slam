[package]
name = "kornia-slam-app"
publish = false
description = "Runnable visual and visual-inertial SLAM application"
version.workspace = true
edition.workspace = true
# rerun 0.29 needs 1.90 and its build tooling 1.91.
rust-version = "1.91"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "kornia-slam"
path = "src/main.rs"

[dependencies]
argh = "0.1"
kornia-slam.workspace = true
kornia-sensors.workspace = true

kornia-3d.workspace = true
kornia-algebra.workspace = true
kornia-image.workspace = true
kornia-imgproc.workspace = true
kornia-io.workspace = true
kornia-tensor.workspace = true

rerun = { version = "0.29.2", optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
libc = "0.2"
depthai = { version = "0.1", optional = true }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native", "decoding"] }
mcap = "0.21"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

[features]
default = ["viz"]
viz = ["dep:rerun"]
oakd = ["dep:depthai"]
uvc = ["dep:nokhwa"]
