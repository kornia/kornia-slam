[package]
name = "kornia-slam-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runnable visual and visual-inertial SLAM application"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kornia-slam"
path = "src/main.rs"

[dependencies]
argh = "0.1"
kornia-slam = { path = "../../crates/kornia-slam" }
kornia-sensors = { path = "../../crates/kornia-sensors" }

kornia-3d = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-algebra = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-image = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-io = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-tensor = { git = "https://github.com/kornia/kornia-rs", branch = "main" }

rerun = { version = "0.29.2", optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
libc = "0.2"
depthai = { version = "0.1", optional = true }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native", "decoding"] }
mcap = "0.21"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

[features]
default = ["viz"]
viz = ["dep:rerun"]
oakd = ["dep:depthai"]
uvc = ["dep:nokhwa"]
apriltag = ["kornia-slam/apriltag"]
