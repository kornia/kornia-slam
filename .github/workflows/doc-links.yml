name: Doc links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '29 6 * * 1'  # Mondays, 06:29 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Offline on pull requests: relative links only, so a third-party
      # outage cannot block a contributor.
      - name: Check links (offline)
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_doc_links.py --offline

      # Networked on schedule and on main, where a failure is a red
      # cron job rather than a blocked pull request.
      - name: Check links (including external)
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/check_doc_links.py
