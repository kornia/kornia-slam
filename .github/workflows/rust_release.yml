name: Rust Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm — this publishes to crates.io and is irreversible'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    # Only from main or a v* tag. Required reviewers and deployment branch
    # rules for the `crates-io` environment live in the repo settings.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io/crates/kornia-slam
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo "::error::Confirmation must be exactly 'publish' (got: '$CONFIRM')"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Plan
        run: ./scripts/release_rust.sh

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/release_rust.sh --execute
