name: Rust Test

# Runs on every push and PR so the required checks always report; the
# `changes` job gates the steps (see rust_lint.yml).
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "apps/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/rust_test.yml"
              - ".github/actions/setup-rust-cache/**"

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default workspace: runs the actual test suite and a CLI smoke run
          # on the app with default features (viz + tui).
          - name: workspace-default
            apt: ""
            test_cmd: cargo test --workspace
            build_cmd: cargo run -p kornia-slam-app -- --help

          # App with no default features — just confirms the non-viz build
          # links and the CLI parses.
          - name: app-no-default
            apt: ""
            test_cmd: ""
            build_cmd: >-
              cargo run
              --manifest-path apps/kornia-slam-app/Cargo.toml
              --no-default-features
              -- --help

          # App with the UVC source — build only (the runner has no camera,
          # so we can't actually open the device).
          - name: app-uvc
            apt: "libv4l-dev"
            test_cmd: ""
            build_cmd: >-
              cargo build
              --manifest-path apps/kornia-slam-app/Cargo.toml
              --features uvc

    steps:
      - uses: actions/checkout@v4
        if: env.RUST_CHANGED == 'true'

      - uses: ./.github/actions/setup-rust-cache
        if: env.RUST_CHANGED == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: env.RUST_CHANGED == 'true'

      - name: Install apt deps
        if: env.RUST_CHANGED == 'true' && matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Run tests
        if: env.RUST_CHANGED == 'true' && matrix.test_cmd != ''
        run: ${{ matrix.test_cmd }}

      - name: Build / smoke-run
        if: env.RUST_CHANGED == 'true'
        run: ${{ matrix.build_cmd }}

      - name: Show sccache stats
        if: always() && env.RUST_CHANGED == 'true'
        run: sccache --show-stats 2>&1 || echo "::warning::sccache stats unavailable"
