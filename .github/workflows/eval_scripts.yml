name: Eval scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Eval script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r scripts/eval/requirements.txt

      - name: Test
        run: python -m unittest discover -s scripts/eval/tests -v
