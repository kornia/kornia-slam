[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = [
    "Christie Purackal <christie@kornia.org>",
    "Edgar Riba <edgar@kornia.org>",
]
license = "Apache-2.0"
repository = "https://github.com/kornia/kornia-slam"
homepage = "https://kornia.org"
categories = ["computer-vision", "science::robotics"]

[workspace.dependencies]
# Cargo cannot inherit workspace.package.version here: bump these with it.
kornia-factors = { path = "crates/kornia-factors", version = "0.2.0" }
kornia-sensors = { path = "crates/kornia-sensors", version = "0.2.0" }
kornia-slam = { path = "crates/kornia-slam", version = "0.2.0" }

kornia-3d = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }
kornia-algebra = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }
kornia-bow = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }
kornia-image = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }
kornia-io = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }
kornia-tensor = { git = "https://github.com/kornia/kornia-rs", rev = "8091be2cbce69da8eb37e5d5cb4f8b0180d02088", version = "0.2.0" }

# Release binaries only (binary_release.yml). Kept out of `release` so local
# benchmark builds stay fast and comparable with earlier runs.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
