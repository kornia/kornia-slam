[workspace]
members = ["crates/*", "examples/orb_slam"]
resolver = "3"

# Astik-2002/kornia-rs@huber-pnp-refine (Huber/Cauchy robust-loss support
# added to kornia-3d's PnP LM refine, not yet upstream). Pinned to a rev,
# not the branch, so this doesn't silently change if more commits land on
# that branch without re-verification. Remove once merged/released upstream.
[patch."https://github.com/kornia/kornia-rs"]
kornia-3d = { git = "https://github.com/Astik-2002/kornia-rs", rev = "8207ad0279c26a205ddad26e763d0aaabb0057f6" }
kornia-algebra = { git = "https://github.com/Astik-2002/kornia-rs", rev = "8207ad0279c26a205ddad26e763d0aaabb0057f6" }
kornia-image = { git = "https://github.com/Astik-2002/kornia-rs", rev = "8207ad0279c26a205ddad26e763d0aaabb0057f6" }
kornia-imgproc = { git = "https://github.com/Astik-2002/kornia-rs", rev = "8207ad0279c26a205ddad26e763d0aaabb0057f6" }
kornia-io = { git = "https://github.com/Astik-2002/kornia-rs", rev = "8207ad0279c26a205ddad26e763d0aaabb0057f6" }
kornia-tensor = { git = "https://github.com/Astik-2002/kornia-rs", rev = "8207ad0279c26a205ddad26e763d0aaabb0057f6" }
