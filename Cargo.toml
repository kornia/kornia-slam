[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = [
    "Christie Purackal <christie@kornia.org>",
    "Edgar Riba <edgar@kornia.org>",
]
license = "Apache-2.0"
repository = "https://github.com/kornia/kornia-slam"
homepage = "https://kornia.org"
categories = ["computer-vision", "science::robotics"]

[workspace.dependencies]
# Cargo cannot inherit workspace.package.version here: bump these with it.
kornia-sensors = { path = "crates/kornia-sensors", version = "0.2.0" }
kornia-slam = { path = "crates/kornia-slam", version = "0.2.0" }

kornia-3d = "0.2.0"
kornia-algebra = "0.2.0"
kornia-bow = "0.2.0"
kornia-image = "0.2.0"
kornia-imgproc = "0.2.0"
kornia-io = "0.2.0"
kornia-tensor = "0.2.0"

# Release binaries only (binary_release.yml). Kept out of `release` so local
# benchmark builds stay fast and comparable with earlier runs.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

# Frontend kernels that match and beat OpenCV (kornia-rs #1303, #1319, #1324): kornia-rs main at a
# fixed rev until a kornia-imgproc release carries them. A [patch] binds only in the root
# workspace: a consumer spells this same block in its own root manifest.
[patch.crates-io]
kornia-3d = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
kornia-algebra = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
kornia-bow = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
kornia-image = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
kornia-io = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
kornia-tensor = { git = "https://github.com/kornia/kornia-rs", rev = "c2bcce1d77b23464b7e3d2e5d0ee12460a8fc4b2" }
