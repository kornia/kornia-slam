[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = [
    "Christie Purackal <christie@kornia.org>",
    "Edgar Riba <edgar@kornia.org>",
]
license = "Apache-2.0"
repository = "https://github.com/kornia/kornia-slam"
homepage = "https://kornia.org"
categories = ["computer-vision", "science::robotics"]

[workspace.dependencies]
# Cargo cannot inherit workspace.package.version here: bump these with it.
kornia-sensors = { path = "crates/kornia-sensors", version = "0.2.0" }
kornia-slam = { path = "crates/kornia-slam", version = "0.2.0" }

kornia-3d = "0.2.0"
kornia-algebra = "0.2.0"
kornia-bow = "0.2.0"
kornia-image = "0.2.0"
kornia-imgproc = "0.2.0"
kornia-io = "0.2.0"
kornia-tensor = "0.2.0"

# Release binaries only (binary_release.yml). Kept out of `release` so local
# benchmark builds stay fast and comparable with earlier runs.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

# Frontend kernels that match and beat OpenCV (kornia-rs #1324, on top of
# #1303/#1319): branch-only until a kornia-imgproc release carries them.
[patch.crates-io]
kornia-3d = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
kornia-algebra = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
kornia-bow = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
kornia-image = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
kornia-imgproc = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
kornia-io = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
kornia-tensor = { git = "https://github.com/edgarriba/kornia-rs", rev = "6df7860ff2934a1e24df038e1fe5df4e4e617285" }
