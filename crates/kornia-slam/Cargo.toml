[package]
name = "kornia-slam"
description = "Real-time visual-inertial SLAM in Rust, built on kornia-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
readme = "../../README.md"
keywords = ["slam", "vio", "visual-odometry", "robotics", "kornia"]

[dependencies]
kornia-3d.workspace = true
kornia-algebra.workspace = true
kornia-image.workspace = true
kornia-imgproc.workspace = true
kornia-bow.workspace = true
# AprilTag detection for the opt-in metric anchor (`apriltag` feature).
kornia-apriltag = { workspace = true, optional = true }
kornia-sensors.workspace = true
# Sparse LLT for pose-graph optimization and dense Cholesky for the reduced
# camera system in visual-inertial Schur-complement BA.
faer = "0.22"
thiserror = "1"
ron = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialization of the system configuration and its RON file loading.
serde = ["dep:serde", "dep:ron"]
# Opt-in AprilTag metric anchor: observe a physical tag in keyframes and apply
# one post-hoc Sim3 correction to the map.
apriltag = ["dep:kornia-apriltag"]

[package.metadata.docs.rs]
features = ["serde", "apriltag"]
