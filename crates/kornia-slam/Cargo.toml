[package]
name = "kornia-slam"
version = "0.1.0"
edition = "2024"
description = "Real-time visual-inertial SLAM in Rust, built on kornia-rs."
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kornia-3d = "0.2.0"
kornia-algebra = "0.2.0"
kornia-image = "0.2.0"
kornia-imgproc = "0.2.0"
kornia-bow = "0.2.0"
kornia-sensors = { path = "../kornia-sensors" }
# Sparse LLT for pose-graph optimization and dense Cholesky for the reduced
# camera system in visual-inertial Schur-complement BA.
faer = "0.22"
thiserror = "1"
